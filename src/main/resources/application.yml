spring:
  application:
    name: urspi-new-site-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Tashkent
        type:
          preferred_enum_jdbc_type: VARCHAR
    database: postgresql
  jackson:
    time-zone: Asia/Tashkent
  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-use-at-least-32-byte-secret!}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    # Use relative URLs so browser stays on same http/https origin
    url: /v3/api-docs
  api-docs:
    path: /v3/api-docs

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin:
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:admin}
      full-name: Super Admin
      phone: "+998972218896"
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
